apply plugin: 'application'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'dev.osujava.lwjgl3.Lwjgl3Launcher'
}

tasks.register('executableJar', Jar) {
    group = 'build'
    description = 'Builds a runnable JAR with the desktop runtime dependencies included.'
    archiveBaseName = 'osujava'
    archiveVersion = project.version
    archiveClassifier = 'all'
    dependsOn configurations.runtimeClasspath

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/SIG-*'
}

run {
    workingDir = rootProject.projectDir
    if (project.hasProperty('skinDirectory')) {
        systemProperty 'osujava.skinDirectory', project.property('skinDirectory')
    }
    if (project.hasProperty('skinArchive')) {
        systemProperty 'osujava.skinArchive', project.property('skinArchive')
    }
    if (project.hasProperty('skinFallbackDirectory')) {
        systemProperty 'osujava.skinFallbackDirectory', project.property('skinFallbackDirectory')
    }
    setIgnoreExitValue(true)
}

// Compile the opt-in visual harness during checks, but never launch it during build/test.
sourceSets {
    hudHarness {
        java.srcDir 'src/hudHarness/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
check.dependsOn hudHarnessClasses
tasks.register('hudVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.LegacyHudVisualHarness'
    args project.findProperty('hudOutput') ?: '/tmp/osujava-hud'
    if (project.hasProperty('hudSkin')) args project.property('hudSkin')
}

tasks.register('judgementVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.LegacyJudgementVisualHarness'
    systemProperty 'java.awt.headless', 'true'
    args project.findProperty('judgementOutput') ?: '/tmp/osujava-judgements'
}

tasks.register('cursorVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.LegacyCursorVisualHarness'
    systemProperty 'java.awt.headless', 'true'
    args project.findProperty('cursorOutput') ?: '/tmp/osujava-cursor'
}

tasks.register('spinnerVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.LegacySpinnerVisualHarness'
    systemProperty 'java.awt.headless', 'true'
    args project.findProperty('spinnerOutput') ?: '/tmp/osujava-spinner'
    if (project.hasProperty('spinnerReportedSkinArchive')) {
        systemProperty 'osujava.spinnerReportedSkinArchive', project.property('spinnerReportedSkinArchive')
    }
    if (project.hasProperty('spinnerCkSkinArchive')) {
        systemProperty 'osujava.spinnerCkSkinArchive', project.property('spinnerCkSkinArchive')
    }
}

tasks.register('mainMenuVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.MainMenuVisualHarness'
    systemProperty 'java.awt.headless', 'true'
    args project.findProperty('mainMenuOutput') ?: '/tmp/osujava-main-menu'
}

// Opt-in playback check with caller-supplied generated tone.mp3 / tone.ogg / tone.wav fixtures.
tasks.register('mainMenuAudioSmoke', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.MainMenuAudioSmoke'
    args project.findProperty('mainMenuAudio') ?: '/tmp/osujava-main-menu-audio'
}

// Use -PskinHarnessJar=... to verify the same gameplay against only the packaged runtime.
tasks.register('bundledSkinVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    mainClass = 'dev.osujava.ui.BundledSkinVisualHarness'
    if (project.hasProperty('skinHarnessJar')) {
        classpath = files(sourceSets.hudHarness.output, project.property('skinHarnessJar'))
    } else {
        // IDE-style exploded classes/resources, rather than the core dependency JAR.
        classpath = (sourceSets.hudHarness.runtimeClasspath - files(project(':core').tasks.named('jar').get().archiveFile))                 + project(':core').sourceSets.main.output
    }
    def output = project.findProperty('skinHarnessOutput') ?: '/tmp/osujava-bundled-skin'
    args output
    systemProperty 'user.home', "${output}/home"
}

// Actual screens + procedural HUD at 720p, 1080p, 1440p and Retina density.
tasks.register('volumeHudVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.VolumeHudVisualHarness'
    systemProperty 'java.awt.headless', 'true'
    args project.findProperty('volumeHudOutput') ?: '/tmp/osujava-volume-hud'
}

// Production SongSelect with Greylooks and partial/malformed skins at 720p, 1080p and Retina density.
tasks.register('songSelectVisualHarness', JavaExec) {
    dependsOn hudHarnessClasses
    classpath = sourceSets.hudHarness.runtimeClasspath
    mainClass = 'dev.osujava.ui.SongSelectVisualHarness'
    systemProperty 'java.awt.headless', 'true'
    args project.findProperty('songSelectOutput') ?: '/tmp/osujava-songselect'
}
