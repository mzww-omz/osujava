apply plugin: 'java-library'

def buildInfoDirectory = layout.buildDirectory.dir('generated/buildInfo')
tasks.register('generateBuildInfo') {
    inputs.property('appVersion', project.version.toString())
    outputs.dir(buildInfoDirectory)
    doLast {
        def output = buildInfoDirectory.get().file('osujava-build.properties').asFile
        output.parentFile.mkdirs()
        output.text = "version=${project.version}\n"
    }
}
sourceSets.main.resources.srcDir(buildInfoDirectory)
tasks.named('processResources') { dependsOn 'generateBuildInfo' }

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Exercise resources from an isolated built JAR, with no source resources on its classpath.
tasks.named('test') {
    dependsOn tasks.named('jar')
    systemProperty 'osujava.coreJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

tasks.register('songSelectPerformanceProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.osujava.ui.SongSelectPerformanceProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Xms512m', '-Xmx512m'
}
